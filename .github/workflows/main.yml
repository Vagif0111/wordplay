name: APK Olustur

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install

      - name: Android projesini olustur
        run: npx cap add android

      - name: Ikonlari uret
        run: npx capacitor-assets generate --android || echo "ikon adimi atlandi"

      - name: Web dosyalarini senkronla
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yi adlandir
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WordPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WordPlay-apk
          path: WordPlay.apk

      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WordPlay build ${{ github.run_number }}
          files: WordPlay.apk
          make_latest: true
